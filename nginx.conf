server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files directly (images, css, js, etc.)
    location /images/ {
        try_files $uri =404;
    }

    # World Cup guide served as standalone static files
    location /worldcup/ {
        try_files $uri $uri/ =404;
    }

    # Voting platform: deankarlan.com/vote -> Google Apps Script web app (keeps ?p=CODE)
    location = /vote  { return 302 https://script.google.com/macros/s/AKfycbzNp_PMeYEMS0_UT3dub2Xsr5Wt0DO1PtwMErIktcxY06b002FhvYzF9EdyJFlIhU5f/exec$is_args$args; }
    location = /vote/ { return 302 https://script.google.com/macros/s/AKfycbzNp_PMeYEMS0_UT3dub2Xsr5Wt0DO1PtwMErIktcxY06b002FhvYzF9EdyJFlIhU5f/exec$is_args$args; }

    # All other paths serve index.html (SPA routing)
    location / {
        try_files $uri /index.html;
    }
}
